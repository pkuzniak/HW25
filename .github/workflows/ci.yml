name: Advanced CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: "3.12"
  APP_NAME: "my-python-app"

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Build application
        run: |
          mkdir -p build
          cp -r *.py build/ 2>/dev/null || true
          echo "Build completed" > build/build-info.txt

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: build/


  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pytest -v
          else
            echo "No tests directory - test step skipped"
          fi

      - name: Pull request information
        if: github.event_name == 'pull_request'
        run: |
          echo "Tests executed for Pull Request"


  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          echo "Deploying $APP_NAME to production..."
          echo "Commit: $GITHUB_SHA"
          echo "Deployment completed"


  status:
    name: Workflow Status
    runs-on: ubuntu-latest

    if: always()

    needs:
      - build
      - test
      - deploy

    steps:
      - name: Show workflow status
        run: |
          echo "Build:  ${{ needs.build.result }}"
          echo "Test:   ${{ needs.test.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"

      - name: Success message
        if: needs.build.result == 'success' && needs.test.result == 'success'
        run: |
          echo "[PASSED] Workflow completed successfully"

      - name: Failure message
        if: needs.build.result == 'failure' || needs.test.result == 'failure'
        run: |
          echo "[FAILED] Workflow failed"
          exit 1